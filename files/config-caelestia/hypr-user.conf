

# exec-once = awww

# Monitor Laptop (Derecha)
monitor = eDP-1, 1920x1080@60, 0x0, 1

# Monitor Externo (Izquierda)
monitor = HDMI-A-1, 1920x1080@180, -1920x0, 1

exec-once = sleep 1 && hyprctl keyword monitor HDMI-A-1,disable
exec-once = sleep 1.2 && hyprctl keyword monitor HDMI-A-1,1920x1080@180,-1920x0,1
exec-once = sleep 1.2 && hyprctl keyword monitor eDP-1,1920x1080@60,0x0,1

# Forzamos un reinicio rápido del puerto por software para asegurar la detección
# hyprctl keyword monitor HDMI-A-1,disable
# sleep 0.2
   
# Aplicamos tu layout real con el monitor externo a la izquierda a 180Hz
# hyprctl keyword monitor HDMI-A-1,1920x1080@180,-1920x0,1
# hyprctl keyword monitor eDP-1,1920x1080@60,0x0,1

debug {
    vfr = false
}
misc {
	vrr = 0
	animate_manual_resizes = false
	always_follow_on_dnd = true 
}

device {
    name = syna2ba6:00-06cb:ce2c-touchpad
    sensitivity = 0.5  # Sube o baja este número a tu gusto (ej. 0.3, 0.7, etc.)
}

input {
    kb_layout = us,latam
    kb_variant =  # Deja vacío si no usas variantes raras
    kb_model =
    kb_options = grp:alt_shift_toggle # Este es el atajo: ALT + SHIFT
    kb_rules =
    sensitivity = 0
    touchpad {
        scroll_factor = 0.5
        natural_scroll = false
        tap-to-click = true
	
    }
    follow_mouse = 1
    # ... resto de tu config
}

env = WLR_RENDERER_ALLOW_SOFTWARE,0
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0

env = WLR_DRM_NO_ATOMIC,1
env = AMD_DEBUG,use_glthread

# DISCORD WINDOW CONFIG
windowrule {
    name = discord-tiling-fix
    match:class = ^(discord)$
    match:workspace = name:special:communication
    tile = 5
}

# --- SECCIÓN DE ATAJOS (BINDS) ---

$mainMod = SUPER

bindn = $mainMod, Q, killactive,
bind = SUPER, P, exec, ~/.config/hypr/scripts/wall-selector.sh 

# VSCODE
unbind = $mainMod, V
bind = $mainMod, V, exec, code

# System Storage
unbind = $mainMod ALT, Space
bind = $mainMod ALT, Space, exec, baobab

# Aplicaciones Principales
unbind = $mainMod ALT, T
unbind = $mainMod ALT, W
unbind = $mainMod ALT, S
unbind = $mainMod ALT, D
bind = $mainMod, B, exec, brave 
bind = $mainMod ALT, T, exec, Telegram
bind = $mainMod ALT, W, exec, brave --app=https://web.whatsapp.com
bind = $mainMod ALT, S, exec, spotify
bind = $mainMod ALT, D, exec, discord

# Super + S: Directo al portapapeles (Rápido y limpio)
unbind = $mainMod, S, 
bind = $mainMod, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Captura" "Imagen en portapapeles"

# Super + W: Captura la ventana activa automáticamente y la copia
unbind = $mainMod, W
bind = $mainMod, W, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | wl-copy && notify-send "Captura" "Ventana copiada al portapapeles"

# Alternar entre Flotante y Mosaico (Esto arregla lo de la ventana enana)
bind = $mainMod ALT, F, togglefloating,

# Move windows through workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

unbind = $mainMod, J
bind = $mainMod, J, togglefloating

unbind = $mainMod, 1
unbind = $mainMod, 2
unbind = $mainMod, 3
unbind = $mainMod, 4
unbind = $mainMod, 5
unbind = $mainMod, 6
unbind = $mainMod, 7
unbind = $mainMod, 8
unbind = $mainMod, 9
# Cambiar de área de trabajo de forma nativa (Instantáneo)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Launcher toggle (Super+Space) - propio, sobrevive a updates
unbind = Super, Space
bind = Super, Space, exec, qs -c caelestia ipc call drawers toggle launcher
