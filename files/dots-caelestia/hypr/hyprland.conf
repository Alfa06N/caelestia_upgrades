$hypr = ~/.config/hypr
$hl = $hypr/hyprland
$cConf = ~/.config/caelestia

# Variables (colours + other vars)
exec-once = ~/Escritorio/scripts/fix_lag.sh
#exec-once = swww-daemon --format xrgb
#exec-once = sleep 2 && swww restore
# exec-once = sleep 2 && swww img (cat ~/.cache/wal/wal) --transition-type none
# exec-once = wal -R
# exec-once = hypridle
source = $hypr/scheme/current.conf
source = $hypr/variables.conf

# Maybe create hyprland configs
# exec = $hypr/scripts/configs.fish $cConf

# User variables
source = $cConf/hypr-vars.conf

debug {
    vfr = false
}
input {  
    touchpad {
        natural_scroll = true
        scroll_factor = 1.2
    }
}
fps_limit = 60
env = QS_RENDER_MODE,basic
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
# Default monitor conf
# monitor = eDP-1, 1920x1080@60, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@180, -1920x0, 1
# quickshell --path ~/.config/caelestia/shell/
# Configs
source = $hl/env.conf
source = $hl/general.conf
source = $hl/input.conf
source = $hl/misc.conf
source = $hl/animations.conf
source = $hl/decoration.conf
source = $hl/group.conf
source = $hl/execs.conf
source = $hl/rules.conf
source = $hl/gestures.conf
source = $hl/keybinds.conf
source = $hl/scrolling.conf

# User configs
source = $cConf/hypr-user.conf

# HyprMod managed settings
source = /home/alfa06n/.config/hypr/hyprland-gui.conf
