general {
    lock_cmd = pidof hyprlock || hyprlock       # Comando para bloquear
    before_sleep_cmd = loginctl lock-session    # Bloquear antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on  # Encender pantalla al volver
}

# 10 MINUTOS: Bloqueo y atenuación
listener {
    timeout = 600
    on-timeout = brightnessctl -s set 10% && loginctl lock-session
    on-resume = brightnessctl -r
}

# 20 MINUTOS: Suspensión Total
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
 
